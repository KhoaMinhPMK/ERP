<!-- KPI Card Component -->
<div class="card" style="padding: 20px;">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px;">
        <div>
            <p class="body-sm" style="color: var(--on-surface-variant); margin-bottom: 8px;">
                <span class="kpi-label">Tổng nhân viên</span>
            </p>
            <h2 class="h1" style="font-size: 32px; font-weight: 700;">
                <span class="kpi-value">248</span>
            </h2>
        </div>
        <div style="width: 48px; height: 48px; border-radius: var(--radius-lg); background-color: var(--primary-fixed); display: flex; align-items: center; justify-content: center;">
            <span class="material-symbols-outlined kpi-icon" style="color: var(--primary); font-size: 28px;">group</span>
        </div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
        <span class="kpi-trend" style="display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: #2e7d32;">
            <span class="material-symbols-outlined" style="font-size: 18px;">trending_up</span>
            <span>+12%</span>
        </span>
        <span class="body-sm" style="color: var(--on-surface-variant);">so với tháng trước</span>
    </div>
</div>
